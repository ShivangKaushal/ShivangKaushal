name: Generate Raining Blocks Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install requests
        
      - name: Run Python Script
        run: python rain_graph.py
        
      - name: Commit and Push SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update raining blocks animation"
          file_pattern: 'raining-blocks.svg'
