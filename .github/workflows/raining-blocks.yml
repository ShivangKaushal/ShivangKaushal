name: Generate Raining Blocks Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Debug - List Files
        run: ls -la
        
      - name: Set up Python
        uses: actions/setup-python@v5 # Upgraded to v5 to fix the Node warning!
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install requests
        
      - name: Run Python Script
        run: python rain_graph.py
        
      - name: Commit and Push SVG
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add raining-blocks.svg
          git commit -m "Update raining blocks animation" || echo "No changes to commit"
          git pull --rebase origin main
          git push
